<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Evidence, missions and physical execution</title><desc id="desc">Explanatory schematic · New observations can change the task and the next control reference.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#287d80"/></marker></defs><rect width="1200" height="660" fill="#f8faf8"/><g font-family="Arial,Helvetica,sans-serif"><text x="48" y="58" font-size="25" fill="#1f3443" text-anchor="start" font-weight="400">Evidence, missions and physical execution</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#c8d6da" stroke-width="3"/><circle cx="250" cy="265" r="102" fill="white" stroke="#287d80" stroke-width="2"/><text x="250" y="263" font-size="29" fill="#287d80" text-anchor="middle" font-weight="400">Information</text><text x="250" y="300" font-size="20" fill="#667b86" text-anchor="middle" font-weight="400">Observe &amp; update</text><line x1="360" y1="265" x2="488" y2="265" stroke="#287d80" stroke-width="4" marker-end="url(#arrow)"/><circle cx="600" cy="265" r="102" fill="white" stroke="#287d80" stroke-width="2"/><text x="600" y="263" font-size="29" fill="#287d80" text-anchor="middle" font-weight="400">Reasoning</text><text x="600" y="300" font-size="20" fill="#667b86" text-anchor="middle" font-weight="400">Select &amp; revise</text><line x1="710" y1="265" x2="838" y2="265" stroke="#287d80" stroke-width="4" marker-end="url(#arrow)"/><circle cx="950" cy="265" r="102" fill="white" stroke="#287d80" stroke-width="2"/><text x="950" y="263" font-size="29" fill="#287d80" text-anchor="middle" font-weight="400">Execution</text><text x="950" y="300" font-size="20" fill="#667b86" text-anchor="middle" font-weight="400">Plan &amp; control</text><rect x="420" y="450" width="360" height="72" rx="8" fill="#e8f1f0" stroke="#c8d6da" stroke-width="2"/><text x="600" y="495" font-size="24" fill="#287d80" text-anchor="middle" font-weight="400">Environment &amp; other agents</text><path d="M950 375 Q950 485 790 485" fill="none" stroke="#287d80" stroke-width="3" marker-end="url(#arrow)"/><path d="M410 485 Q250 485 250 375" fill="none" stroke="#287d80" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="574" font-size="23" fill="#667b86" text-anchor="middle" font-weight="400">Each agent carries its own coupled update loop.</text><line x1="48" y1="600" x2="1152" y2="600" stroke="#c8d6da" stroke-width="3"/><text x="48" y="634" font-size="18" fill="#667b86" text-anchor="start" font-weight="400">Explanatory schematic · New observations can change the task and the next control reference.</text></g></svg>