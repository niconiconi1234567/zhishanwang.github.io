e" font-weight="400">Local</text><text x="970" y="300" font-size="24" fill="#287d80" text-anchor="middle" font-weight="400">decision</text><path d="M660 275 C760 275 760 270 870 270" fill="none" stroke="#287d80" stroke-width="4" stroke-dasharray="8 8" marker-end="url(#arrow)"/><text x="920" y="455" font-size="23" fill="#1f3443" text-anchor="middle" font-weight="400">Evidence must arrive</text><text x="920" y="490" font-size="21" fill="#667b86" text-anchor="middle" font-weight="400">through a causal protocol.</text><text x="100" y="565" font-size="22" fill="#667b86" text-anchor="start" font-weight="400">Hidden interaction histories</text><line x1="48" y1="600" x2="1152" y2="600" stroke="#c8d6da" stroke-width="3"/><text x="48" y="634" font-size="18" fill="#667b86" text-anchor="start" font-weight="400">Explanatory schematic · Pooled evidence can exceed what a local agent can attain in time.</text></g></svg>