<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">From observed behavior to a changed mission</title><desc id="desc">Explanatory schematic · Identifiability, decision value and physical benefit are tested separately.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#287d80"/></marker></defs><rect width="1200" height="660" fill="#f8faf8"/><g font-family="Arial,Helvetica,sans-serif"><text x="48" y="58" font-size="25" fill="#1f3443" text-anchor="start" font-weight="400">From observed behavior to a changed mission</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#c8d6da" stroke-width="3"/><text x="70" y="145" font-size="24" fill="#1f3443" text-anchor="start" font-weight="400">Observe one action</text><line x1="70" y1="166" x2="370" y2="166" stroke="#c8d6da" stroke-width="2"/><text x="435" y="145" font-size="24" fill="#1f3443" text-anchor="start" font-weight="400">Observe a relation</text><line x1="435" y1="166" x2="735" y2="166" stroke="#c8d6da" stroke-width="2"/><text x="800" y="145" font-size="24" fill="#1f3443" text-anchor="start" font-weight="400">Choose an action</text><line x1="800" y1="166" x2="1100" y2="166" stroke="#c8d6da" stroke-width="2"/><circle cx="140" cy="275" r="20" fill="#287d80" stroke="none" stroke-width="2"/><line x1="140" y1="300" x2="140" y2="420" stroke="#287d80" stroke-width="5" marker-end="url(#arrow)"/><text x="215" y="310" font-size="70" fill="#bd7750" text-anchor="middle" font-weight="400">?</text><text x="70" y="500" font-size="22" fill="#667b86" text-anchor="start" font-weight="400">Several hidden states</text><text x="70" y="533" font-size="20" fill="#667b86" text-anchor="start" font-weight="400">can explain the same motion.</text><circle cx="490" cy="275" r="20" fill="#287d80" stroke="none" stroke-width="2"/><circle cx="650" cy="275" r="20" fill="#bd7750" stroke="none" stroke-width="2"/><line x1="490" y1="300" x2="490" y2="420" stroke="#287d80" stroke-width="5" marker-end="url(#arrow)"/><line x1="650" y1="300" x2="650" y2="420" stroke="#287d80" stroke-width="5" marker-end="url(#arrow)"/><path d="M505 340 Q570 305 635 340" fill="none" stroke="#bd7750" stroke-width="3"/><text x="435" y="500" font-size="22" fill="#667b86" text-anchor="start" font-weight="400">Joint evidence can separate</text><text x="435" y="533" font-size="20" fill="#667b86" text-anchor="start" font-weight="400">previously ambiguous states.</text><rect x="830" y="240" width="230" height="65" rx="8" fill="white" stroke="#c8d6da" stroke-width="2"/><text x="945" y="281" font-size="26" fill="#667b86" text-anchor="middle" font-weight="400">WAIT</text><line x1="945" y1="320" x2="945" y2="370" stroke="#287d80" stroke-width="4" marker-end="url(#arrow)"/><rect x="830" y="390" width="230" height="65" rx="8" fill="#e8f1f0" stroke="#287d80" stroke-width="2"/><text x="945" y="431" font-size="26" fill="#287d80" text-anchor="middle" font-weight="400">COVER</text><line x1="48" y1="600" x2="1152" y2="600" stroke="#c8d6da" stroke-width="3"/><text x="48" y="634" font-size="18" fill="#667b86" text-anchor="start" font-weight="400">Explanatory schematic · Identifiability, decision value and physical benefit are tested separately.</text></g></svg>