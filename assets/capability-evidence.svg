" fill="#617582" font-weight="400">distinctions survive? What</text><text x="832" y="347" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">changes under failures?</text><line x1="48" y1="551" x2="1152" y2="551" stroke="#b9cbd2"/><text x="48" y="588" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#617582" font-weight="400">Connectivity, information diversity and resilience are different properties.</text></svg>