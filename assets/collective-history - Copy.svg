<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img"><title>Collective evidence must become locally attainable</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#307f81"/></marker></defs><rect width="1200" height="620" rx="18" fill="#f8fafb"/><text x="48" y="48" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#307f81" font-weight="700">OGT1 · IMPERFECT INFORMATION AND CAUSAL COMMUNICATION</text><text x="48" y="94" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#203b51" font-weight="400">Collective evidence must become locally attainable</text><line x1="48" y1="119" x2="1152" y2="119" stroke="#b9cbd2"/><rect x="50" y="205" width="220" height="58" rx="10" fill="white" stroke="#b9cbd2"/><text x="72" y="242" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#203b51" font-weight="400">History h</text><rect x="50" y="290" width="220" height="58" rx="10" fill="white" stroke="#b9cbd2"/><text x="72" y="327" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#203b51" font-weight="400">History h′</text><text x="48" y="405" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#617582" font-weight="400">Locally ambiguous</text><path d="M275,260 L365,260" fill="none" stroke="#307f81" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="370" y="170" width="360" height="275" rx="16" fill="white" stroke="#b9cbd2"/><rect x="370" y="190" width="4" height="235" fill="#307f81"/><text x="392" y="208" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#307f81" font-weight="700">SENSE · QUERY · COMMUNICATE</text><text x="392" y="240" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#203b51" font-weight="600">Complementary evidence</text><text x="392" y="279" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">Different agents separate</text><text x="392" y="308" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">different history pairs. A</text><text x="392" y="337" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">causal protocol must deliver</text><text x="392" y="366" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">the needed evidence in time.</text><path d="M730,295 L810,295" fill="none" stroke="#307f81" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="815" y="170" width="335" height="275" rx="16" fill="white" stroke="#b9cbd2"/><rect x="815" y="190" width="4" height="235" fill="#203b51"/><text x="837" y="208" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#203b51" font-weight="700">RECOVER · DECIDE</text><text x="837" y="240" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#203b51" font-weight="600">Usable distinction</text><text x="837" y="279" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">Resolve the decision-</text><text x="837" y="308" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">relevant ambiguity at the</text><text x="837" y="337" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">agent that must act.</text><line x1="48" y1="551" x2="1152" y2="551" stroke="#b9cbd2"/><text x="48" y="588" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#617582" font-weight="400">Jointly distinguishable does not automatically mean recoverable by a local agent.</text></svg>