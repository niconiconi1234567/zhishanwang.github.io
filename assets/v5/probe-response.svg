<svg xmlns="http://www.w3.org/2000/svg" width="850" height="292" viewBox="0 0 850 292" role="img" aria-labelledby="t d"><title id="t">A probe reveals an interest and elicits a physical response</title><desc id="d">In one round the observer chooses a visible probe. The team infers its interest, takes a control action, and the observer receives a scalar endpoint before its final decision.</desc>
<defs><marker id="arrow" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 8 4 0 8z" fill="#58706a"/></marker></defs>
<rect width="850" height="292" fill="#f5f6ef"/><g fill="#293d3e" font-family="Arial,sans-serif"><text x="30" y="33" font-size="15" letter-spacing="2">ONE ROUND OF RECIPROCAL INFERENCE</text></g>
<g fill="#fffef9" stroke="#aec4bb" stroke-width="1.5"><rect x="29" y="60" width="234" height="72" rx="5"/><rect x="565" y="60" width="256" height="72" rx="5"/><rect x="565" y="185" width="256" height="72" rx="5"/><rect x="29" y="185" width="234" height="72" rx="5"/></g>
<g fill="#245652" font-family="Georgia,serif" font-size="24"><text x="46" y="92">Observer</text><text x="583" y="92">Networked team</text><text x="583" y="217">Physical response</text><text x="46" y="217">Final decision</text></g>
<g font-family="Arial,sans-serif" font-size="16" fill="#475751"><text x="46" y="116">Private interest</text><text x="583" y="116">Private task attributes</text><text x="583" y="242">Energy-penalised control</text><text x="46" y="242">Uses the measured endpoint</text></g>
<g fill="none" stroke="#58706a" stroke-width="2.4" marker-end="url(#arrow)"><path d="M272 103h280"/><path d="M694 138v37"/><path d="M555 227H275"/></g>
<g font-family="Arial,sans-serif" font-size="16" fill="#293d3e"><text x="415" y="87" text-anchor="middle">Visible choice of probe</text><text x="414" y="212" text-anchor="middle">Scalar endpoint</text><text x="488" y="160">Belief about interest</text></g></svg>