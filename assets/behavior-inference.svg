<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img"><title>A relationship between actions can carry hidden information</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#307f81"/></marker></defs><rect width="1200" height="620" rx="18" fill="#f8fafb"/><text x="48" y="48" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#307f81" font-weight="700">BEHAVIOR-MEDIATED COORDINATION · NO EXPLICIT MESSAGES</text><text x="48" y="94" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#203b51" font-weight="400">A relationship between actions can carry hidden information</text><line x1="48" y1="119" x2="1152" y2="119" stroke="#b9cbd2"/><circle cx="120" cy="215" r="30" fill="white" stroke="#307f81" stroke-width="2.4"/><text x="115.5" y="222" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#307f81" font-weight="600">A</text><circle cx="245" cy="215" r="30" fill="white" stroke="#307f81" stroke-width="2.4"/><text x="240.5" y="222" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#307f81" font-weight="600">B</text><circle cx="120" cy="350" r="30" fill="white" stroke="#307f81" stroke-width="2.4"/><text x="115.5" y="357" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#307f81" font-weight="600">A</text><circle cx="245" cy="350" r="30" fill="white" stroke="#307f81" stroke-width="2.4"/><text x="240.5" y="357" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#307f81" font-weight="600">B</text><path d="M120,183 L120,151" fill="none" stroke="#307f81" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M245,183 L245,151" fill="none" stroke="#307f81" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M120,318 L120,286" fill="none" stroke="#307f81" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M245,381 L245,414" fill="none" stroke="#307f81" stroke-width="2.2" marker-end="url(#arrow)"/><text x="50" y="465" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#617582" font-weight="400">Same direction / opposite direction</text><path d="M285,280 L372,280" fill="none" stroke="#307f81" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="380" y="170" width="355" height="270" rx="16" fill="white" stroke="#b9cbd2"/><rect x="380" y="190" width="4" height="230" fill="#307f81"/><text x="402" y="208" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#307f81" font-weight="700">OBSERVE &amp; INFER</text><text x="402" y="240" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#203b51" font-weight="600">Joint interpretation</text><text x="402" y="279" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">Individual movements may be</text><text x="402" y="308" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">ambiguous. Their relation</text><text x="402" y="337" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">can distinguish hidden</text><text x="402" y="366" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">possibilities.</text><path d="M735,290 L808,290" fill="none" stroke="#307f81" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="815" y="170" width="335" height="270" rx="16" fill="white" stroke="#b9cbd2"/><rect x="815" y="190" width="4" height="230" fill="#203b51"/><text x="837" y="208" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#203b51" font-weight="700">DECIDE &amp; EXECUTE</text><text x="837" y="240" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#203b51" font-weight="600">Mission adaptation</text><text x="837" y="279" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">Combine inferred evidence</text><text x="837" y="308" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">with local knowledge,</text><text x="837" y="337" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">then update a task or</text><text x="837" y="366" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">control reference.</text><line x1="48" y1="551" x2="1152" y2="551" stroke="#b9cbd2"/><text x="48" y="588" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#617582" font-weight="400">Illustrative mechanism; performance must be compared with information-matched baselines.</text></svg>