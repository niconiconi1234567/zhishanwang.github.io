<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img"><title>A fitted edge needs evidence</title><desc>Explanatory schematic · an association is not automatically causal</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#287b78" stroke-width="1.5"/></marker></defs><rect width="960" height="600" fill="#f3f5ef"/><text x="40" y="49" fill="#193640" font-family="Arial,Helvetica,sans-serif" font-size="28" text-anchor="start" font-weight="600">A fitted edge needs evidence</text><path d="M40 74 H920" stroke="#ccdcd9"/><rect x="55" y="120" width="390" height="95" rx="9" fill="#fff" stroke="#4c83ac" stroke-width="2"/><text x="75" y="158" fill="#4c83ac" font-family="Arial,Helvetica,sans-serif" font-size="25" text-anchor="start" font-weight="600">Actual input traces</text><text x="75" y="189" fill="#5c7278" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="start" font-weight="400">Direction · timestamp · contribution</text><rect x="515" y="120" width="390" height="95" rx="9" fill="#fff" stroke="#287b78" stroke-width="2"/><text x="535" y="158" fill="#287b78" font-family="Arial,Helvetica,sans-serif" font-size="25" text-anchor="start" font-weight="600">Observed motion</text><text x="535" y="189" fill="#5c7278" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="start" font-weight="400">A separate regression model</text><path d="M710 215 V265" fill="none" stroke="#287b78" stroke-width="3" marker-end="url(#arrow)"/><rect x="515" y="265" width="390" height="95" rx="9" fill="#fff" stroke="#287b78" stroke-width="2"/><text x="535" y="303" fill="#287b78" font-family="Arial,Helvetica,sans-serif" font-size="25" text-anchor="start" font-weight="600">Train → gap → holdout</text><text x="535" y="334" fill="#5c7278" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="start" font-weight="400">Compare against a no-neighbor model</text><rect x="55" y="265" width="390" height="95" rx="9" fill="#fff" stroke="#ac792e" stroke-width="2"/><text x="75" y="303" fill="#ac792e" font-family="Arial,Helvetica,sans-serif" font-size="25" text-anchor="start" font-weight="600">Sufficient excitation?</text><text x="75" y="334" fill="#5c7278" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="start" font-weight="400">Check rank before showing edges</text><path d="M445 313 H515" fill="none" stroke="#287b78" stroke-width="3" marker-end="url(#arrow)"/><path d="M710 360 V410 H480 V430" fill="none" stroke="#287b78" stroke-width="3" marker-end="url(#arrow)"/><rect x="180" y="430" width="600" height="80" rx="9" fill="#fff" stroke="#287b78" stroke-width="2"/><text x="200" y="468" fill="#287b78" font-family="Arial,Helvetica,sans-serif" font-size="25" text-anchor="start" font-weight="600">What can the data distinguish?</text><path d="M40 541 H920" stroke="#ccdcd9"/><text x="40" y="576" fill="#5c7278" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="start" font-weight="400">Explanatory schematic · an association is not automatically causal</text></svg>