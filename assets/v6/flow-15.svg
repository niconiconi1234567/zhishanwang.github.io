<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img"><title>An editable graph with runtime semantics</title><desc>Illustrative chain · eight fixed outfield states; goalkeeper policy is separate</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#287b78" stroke-width="1.5"/></marker></defs><rect width="960" height="600" fill="#f3f5ef"/><text x="40" y="49" fill="#193640" font-family="Arial,Helvetica,sans-serif" font-size="28" text-anchor="start" font-weight="600">An editable graph with runtime semantics</text><path d="M40 74 H920" stroke="#ccdcd9"/><rect x="55" y="155" width="240" height="90" rx="9" fill="#fff" stroke="#287b78" stroke-width="2"/><text x="75" y="193" fill="#287b78" font-family="Arial,Helvetica,sans-serif" font-size="25" text-anchor="start" font-weight="600">Hold shape</text><rect x="360" y="155" width="240" height="90" rx="9" fill="#fff" stroke="#4c83ac" stroke-width="2"/><text x="380" y="193" fill="#4c83ac" font-family="Arial,Helvetica,sans-serif" font-size="25" text-anchor="start" font-weight="600">Press</text><rect x="665" y="155" width="240" height="90" rx="9" fill="#fff" stroke="#287b78" stroke-width="2"/><text x="685" y="193" fill="#287b78" font-family="Arial,Helvetica,sans-serif" font-size="25" text-anchor="start" font-weight="600">Recover</text><path d="M295 200 H360" fill="none" stroke="#287b78" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 200 H665" fill="none" stroke="#287b78" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="135" fill="#5c7278" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="middle" font-weight="400">guard</text><text x="632" y="135" fill="#5c7278" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="middle" font-weight="400">guard</text><path d="M785 245 V294 H175 V245" fill="none" stroke="#287b78" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="323" fill="#193640" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle" font-weight="400">Source + guard → confirmation → prerequisites → commit</text><rect x="55" y="365" width="158" height="64" rx="6" fill="#e4eeea" stroke="#ccdcd9"/><text x="134" y="405" fill="#193640" font-family="Arial,Helvetica,sans-serif" font-size="23" text-anchor="middle" font-weight="400">Collect</text><rect x="227" y="365" width="158" height="64" rx="6" fill="#e4eeea" stroke="#ccdcd9"/><text x="306" y="405" fill="#193640" font-family="Arial,Helvetica,sans-serif" font-size="23" text-anchor="middle" font-weight="400">Screen</text><rect x="399" y="365" width="158" height="64" rx="6" fill="#e4eeea" stroke="#ccdcd9"/><text x="478" y="405" fill="#193640" font-family="Arial,Helvetica,sans-serif" font-size="23" text-anchor="middle" font-weight="400">Cover</text><rect x="571" y="365" width="158" height="64" rx="6" fill="#e4eeea" stroke="#ccdcd9"/><text x="650" y="405" fill="#193640" font-family="Arial,Helvetica,sans-serif" font-size="23" text-anchor="middle" font-weight="400">Support</text><rect x="743" y="365" width="158" height="64" rx="6" fill="#e4eeea" stroke="#ccdcd9"/><text x="822" y="405" fill="#193640" font-family="Arial,Helvetica,sans-serif" font-size="23" text-anchor="middle" font-weight="400">Carry</text><text x="480" y="486" fill="#287b78" font-family="Arial,Helvetica,sans-serif" font-size="27" text-anchor="middle" font-weight="600">Candidate rule ≠ committed transition</text><path d="M40 541 H920" stroke="#ccdcd9"/><text x="40" y="576" fill="#5c7278" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="start" font-weight="400">Illustrative chain · eight fixed outfield states; goalkeeper policy is separate</text></svg>