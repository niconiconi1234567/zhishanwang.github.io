<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1720" viewBox="0 0 1800 1720" role="img" aria-labelledby="title desc"><title id="title">Zhishan Wang — research atlas</title><desc id="desc">Ten connected research threads across information, inference and coordination, with thirty subtopics.</desc><rect width="1800" height="1720" fill="#f7f7f2"/><text x="65" y="64" font-family="Arial" font-size="17" fill="#226d70">ZHISHAN WANG / NTU EEE / RIM LAB</text><text x="65" y="128" font-family="Georgia" font-size="49" fill="#1d2e39">From partial evidence to purposeful action.</text><text x="65" y="177" font-family="Arial" font-size="22" fill="#596b73">One research programme: information, understanding and action in heterogeneous multi-agent systems.</text><rect x="65" y="222" width="535" height="4" fill="#226d70"/><text x="65" y="260" font-family="Georgia" font-size="25" fill="#226d70">01 / Information &amp; knowledge</text><text x="65" y="296" font-family="Arial" font-size="19" fill="#596b73">What can an agent know?</text><rect x="65" y="328" width="535" height="258" rx="5" fill="#ffffff" stroke="#d6dedb"/><rect x="65" y="346" width="4" height="38" fill="#226d70"/><text x="90" y="363" font-family="Arial" font-size="14" fill="#226d70">SUBMITTED STUDIES</text><text x="90" y="406" font-family="Georgia" font-size="31" fill="#1d2e39">OWN2</text><text x="90" y="436" font-family="Arial" font-size="18" fill="#596b73">Private cognition · collective estimation</text><path d="M90 455h485" stroke="#d6dedb"/><text x="90" y="485" font-family="Arial" font-size="19" fill="#1d2e39">•  Partial signals &amp; private models</text><text x="90" y="519" font-family="Arial" font-size="19" fill="#1d2e39">•  Confidence-aware consultation</text><text x="90" y="553" font-family="Arial" font-size="19" fill="#1d2e39">•  Interpret · use · forward</text><rect x="65" y="608" width="535" height="258" rx="5" fill="#ffffff" stroke="#d6dedb"/><rect x="65" y="626" width="4" height="38" fill="#226d70"/><text x="90" y="643" font-family="Arial" font-size="14" fill="#226d70">THEORY IN DEVELOPMENT</text><text x="90" y="686" font-family="Georgia" font-size="31" fill="#1d2e39">OWN2 Plus</text><text x="90" y="716" font-family="Arial" font-size="18" fill="#596b73">Capabilities · evidence · resilience</text><path d="M90 735h485" stroke="#d6dedb"/><text x="90" y="765" font-family="Arial" font-size="19" fill="#1d2e39">•  Executable information formation</text><text x="90" y="799" font-family="Arial" font-size="19" fill="#1d2e39">•  Collective state identifiability</text><text x="90" y="833" font-family="Arial" font-size="19" fill="#1d2e39">•  Failure-resilient acquisition</text><rect x="65" y="888" width="535" height="258" rx="5" fill="#ffffff" stroke="#d6dedb"/><rect x="65" y="906" width="4" height="38" fill="#226d70"/><text x="90" y="923" font-family="Arial" font-size="14" fill="#226d70">THEORY IN DEVELOPMENT</text><text x="90" y="966" font-family="Georgia" font-size="31" fill="#1d2e39">OGT1</text><text x="90" y="996" font-family="Arial" font-size="18" fill="#596b73">Structural distinction · causal access</text><path d="M90 1015h485" stroke="#d6dedb"/><text x="90" y="1045" font-family="Arial" font-size="19" fill="#1d2e39">•  Collective history identifiability</text><text x="90" y="1079" font-family="Arial" font-size="19" fill="#1d2e39">•  Two-way communication protocols</text><text x="90" y="1113" font-family="Arial" font-size="19" fill="#1d2e39">•  Observers &amp; stabilizability</text><rect x="632" y="222" width="535" height="4" fill="#95694c"/><text x="632" y="260" font-family="Georgia" font-size="25" fill="#95694c">02 / Inference &amp; interaction</text><text x="632" y="296" font-family="Arial" font-size="19" fill="#596b73">What can behavior reveal?</text><rect x="632" y="328" width="535" height="258" rx="5" fill="#ffffff" stroke="#d6dedb"/><rect x="632" y="346" width="4" height="38" fill="#95694c"/><text x="657" y="363" font-family="Arial" font-size="14" fill="#95694c">ISCS · SUBMITTED</text><text x="657" y="406" font-family="Georgia" font-size="31" fill="#1d2e39">Behavior as information</text><text x="657" y="436" font-family="Arial" font-size="18" fill="#596b73">Hidden state · decision relevance</text><path d="M657 455h485" stroke="#d6dedb"/><text x="657" y="485" font-family="Arial" font-size="19" fill="#1d2e39">•  Observe neighboring actions</text><text x="657" y="519" font-family="Arial" font-size="19" fill="#1d2e39">•  Infer complementary information</text><text x="657" y="553" font-family="Arial" font-size="19" fill="#1d2e39">•  Evaluate closed-loop value</text><rect x="632" y="608" width="535" height="258" rx="5" fill="#ffffff" stroke="#d6dedb"/><rect x="632" y="626" width="4" height="38" fill="#95694c"/><text x="657" y="643" font-family="Arial" font-size="14" fill="#95694c">THEORY IN DEVELOPMENT</text><text x="657" y="686" font-family="Georgia" font-size="31" fill="#1d2e39">The Lonely Observer</text><text x="657" y="716" font-family="Arial" font-size="18" fill="#596b73">Learn · distinguish · participate</text><path d="M657 735h485" stroke="#d6dedb"/><text x="657" y="765" font-family="Arial" font-size="19" fill="#1d2e39">•  Control value of observed actions</text><text x="657" y="799" font-family="Arial" font-size="19" fill="#1d2e39">•  Finite-window identifiability</text><text x="657" y="833" font-family="Arial" font-size="19" fill="#1d2e39">•  Action-sensing &amp; reliability</text><rect x="632" y="888" width="535" height="258" rx="5" fill="#ffffff" stroke="#d6dedb"/><rect x="632" y="906" width="4" height="38" fill="#95694c"/><text x="657" y="923" font-family="Arial" font-size="14" fill="#95694c">EXPLORATORY BRANCH</text><text x="657" y="966" font-family="Georgia" font-size="31" fill="#1d2e39">Strategic participation</text><text x="657" y="996" font-family="Arial" font-size="18" fill="#596b73">Information · incentives · intervention</text><path d="M657 1015h485" stroke="#d6dedb"/><text x="657" y="1045" font-family="Arial" font-size="19" fill="#1d2e39">•  Learning while taking action</text><text x="657" y="1079" font-family="Arial" font-size="19" fill="#1d2e39">•  Probing costs &amp; strategic response</text><text x="657" y="1113" font-family="Arial" font-size="19" fill="#1d2e39">•  Passive prediction vs intervention</text><rect x="1199" y="222" width="535" height="4" fill="#6b839b"/><text x="1199" y="260" font-family="Georgia" font-size="25" fill="#6b839b">03 / Coordination &amp; execution</text><text x="1199" y="296" font-family="Arial" font-size="19" fill="#596b73">When can knowledge become action?</text><rect x="1199" y="328" width="535" height="258" rx="5" fill="#ffffff" stroke="#d6dedb"/><rect x="1199" y="346" width="4" height="38" fill="#6b839b"/><text x="1224" y="363" font-family="Arial" font-size="14" fill="#6b839b">ICARCV · ACCEPTED</text><text x="1224" y="406" font-family="Georgia" font-size="31" fill="#1d2e39">OWN Tactic</text><text x="1224" y="436" font-family="Arial" font-size="18" fill="#596b73">Relational formation · team behavior</text><path d="M1224 455h485" stroke="#d6dedb"/><text x="1224" y="485" font-family="Arial" font-size="19" fill="#1d2e39">•  Task-conditioned formation</text><text x="1224" y="519" font-family="Arial" font-size="19" fill="#1d2e39">•  Two-team tactical interaction</text><text x="1224" y="553" font-family="Arial" font-size="19" fill="#1d2e39">•  Behavior-informed coordination</text><rect x="1199" y="608" width="535" height="258" rx="5" fill="#ffffff" stroke="#d6dedb"/><rect x="1199" y="626" width="4" height="38" fill="#6b839b"/><text x="1224" y="643" font-family="Arial" font-size="14" fill="#6b839b">ICSC · SUBMITTED</text><text x="1224" y="686" font-family="Georgia" font-size="31" fill="#1d2e39">Team racing</text><text x="1224" y="716" font-family="Arial" font-size="18" fill="#596b73">Shared strategy · differentiated roles</text><path d="M1224 735h485" stroke="#d6dedb"/><text x="1224" y="765" font-family="Arial" font-size="19" fill="#1d2e39">•  Translate strategy into references</text><text x="1224" y="799" font-family="Arial" font-size="19" fill="#1d2e39">•  Preserve functional role differences</text><text x="1224" y="833" font-family="Arial" font-size="19" fill="#1d2e39">•  Planning &amp; closed-loop control</text><rect x="1199" y="888" width="535" height="258" rx="5" fill="#ffffff" stroke="#d6dedb"/><rect x="1199" y="906" width="4" height="38" fill="#6b839b"/><text x="1224" y="923" font-family="Arial" font-size="14" fill="#6b839b">DEMONSTRATION PROGRAMME</text><text x="1224" y="966" font-family="Georgia" font-size="31" fill="#1d2e39">Mission-to-Control</text><text x="1224" y="996" font-family="Arial" font-size="18" fill="#596b73">Evidence · rules · executable missions</text><path d="M1224 1015h485" stroke="#d6dedb"/><text x="1224" y="1045" font-family="Arial" font-size="19" fill="#1d2e39">•  Source-aware observations</text><text x="1224" y="1079" font-family="Arial" font-size="19" fill="#1d2e39">•  Evidence-supported rule activation</text><text x="1224" y="1113" font-family="Arial" font-size="19" fill="#1d2e39">•  Mission transitions &amp; feedback</text><rect x="1199" y="1168" width="535" height="258" rx="5" fill="#ffffff" stroke="#d6dedb"/><rect x="1199" y="1186" width="4" height="38" fill="#6b839b"/><text x="1224" y="1203" font-family="Arial" font-size="14" fill="#6b839b">THREE SIMULATION DEMOS</text><text x="1224" y="1246" font-family="Georgia" font-size="31" fill="#1d2e39">Search &amp; rescue</text><text x="1224" y="1276" font-family="Arial" font-size="18" fill="#596b73">Activate · cooperate · acquire</text><path d="M1224 1295h485" stroke="#d6dedb"/><text x="1224" y="1325" font-family="Arial" font-size="19" fill="#1d2e39">•  Demo 0 · activate and reuse rules</text><text x="1224" y="1359" font-family="Arial" font-size="19" fill="#1d2e39">•  Demo 1 · cooperate and evacuate</text><text x="1224" y="1393" font-family="Arial" font-size="19" fill="#1d2e39">•  Demo 2 · acquire missing evidence</text><text x="65" y="1510" font-family="Arial" font-size="16" fill="#226d70">INTELLECTUAL CONNECTIONS</text><text x="65" y="1550" font-family="Georgia" font-size="23" fill="#1d2e39">Private cognition → executable evidence → causally attainable knowledge.</text><text x="65" y="1585" font-family="Georgia" font-size="23" fill="#1d2e39">Observed actions → hidden-state inference → control value and strategic participation.</text><text x="65" y="1620" font-family="Georgia" font-size="23" fill="#1d2e39">Shared intent → evidence-supported missions → cooperative physical execution.</text><text x="65" y="1680" font-family="Arial" font-size="17" fill="#596b73">October 2026 · Connections are conceptual, not publication order or proven dependencies. See the website for scope and sources.</text></svg>