<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Evidence to mission execution</title><desc id="desc">Observation feeds confidence assessment and a search for missing evidence. Supported rules enable mission choices and execution. New action returns new observations. The six steps organize a coupled process.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#226d70"/></marker></defs><rect width="1200" height="760" fill="#f8faf8"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="52" font-size="26" fill="#1d2e39">How evidence changes an executable mission</text><text x="44" y="84" font-size="17" fill="#5c6e77">A conceptual reading guide to the coupled Information–Reasoning–Execution loop</text><rect x="44" y="130" width="350" height="190" rx="6" fill="white" stroke="#ccd9d7" stroke-width="2"/><text x="67" y="166" font-size="15" fill="#955d3c">01</text><text x="67" y="207" font-size="24" fill="#226d70">Observation</text><text x="67" y="249" font-size="19" fill="#5c6e77">Measurements, messages,</text><text x="67" y="277" font-size="19" fill="#5c6e77">and their provenance.</text><path d="M397 225h23" stroke="#226d70" stroke-width="2" marker-end="url(#arrow)"/><rect x="424" y="130" width="350" height="190" rx="6" fill="white" stroke="#ccd9d7" stroke-width="2"/><text x="447" y="166" font-size="15" fill="#955d3c">02</text><text x="447" y="207" font-size="24" fill="#226d70">Confidence assessment</text><text x="447" y="249" font-size="19" fill="#5c6e77">Separate fact confidence</text><text x="447" y="277" font-size="19" fill="#5c6e77">from rule support.</text><path d="M777 225h23" stroke="#226d70" stroke-width="2" marker-end="url(#arrow)"/><rect x="804" y="130" width="350" height="190" rx="6" fill="white" stroke="#ccd9d7" stroke-width="2"/><text x="827" y="166" font-size="15" fill="#955d3c">03</text><text x="827" y="207" font-size="24" fill="#226d70">Evidence finding</text><text x="827" y="249" font-size="19" fill="#5c6e77">Identify missing prerequisites;</text><text x="827" y="277" font-size="19" fill="#5c6e77">seek a useful observation.</text><rect x="44" y="380" width="350" height="190" rx="6" fill="white" stroke="#ccd9d7" stroke-width="2"/><text x="67" y="416" font-size="15" fill="#955d3c">04</text><text x="67" y="457" font-size="24" fill="#226d70">Rule activation</text><text x="67" y="499" font-size="19" fill="#5c6e77">Check support, grounding</text><text x="67" y="527" font-size="19" fill="#5c6e77">and transition conditions.</text><path d="M397 475h23" stroke="#226d70" stroke-width="2" marker-end="url(#arrow)"/><rect x="424" y="380" width="350" height="190" rx="6" fill="white" stroke="#ccd9d7" stroke-width="2"/><text x="447" y="416" font-size="15" fill="#955d3c">05</text><text x="447" y="457" font-size="24" fill="#226d70">Mission-state extension</text><text x="447" y="499" font-size="19" fill="#5c6e77">Enable justified tasks and</text><text x="447" y="527" font-size="19" fill="#5c6e77">state transitions.</text><path d="M777 475h23" stroke="#226d70" stroke-width="2" marker-end="url(#arrow)"/><rect x="804" y="380" width="350" height="190" rx="6" fill="white" stroke="#ccd9d7" stroke-width="2"/><text x="827" y="416" font-size="15" fill="#955d3c">06</text><text x="827" y="457" font-size="24" fill="#226d70">Physical execution</text><text x="827" y="499" font-size="19" fill="#5c6e77">Generate references, act,</text><text x="827" y="527" font-size="19" fill="#5c6e77">and check the outcome.</text><path d="M1158 225h18v125H24v125h15" fill="none" stroke="#226d70" stroke-width="2" marker-end="url(#arrow)"/><path d="M978 580v80H12V225h27" fill="none" stroke="#955d3c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="600" y="631" text-anchor="middle" font-size="18" fill="#955d3c">Action produces new evidence · Repeat and revise</text><text x="44" y="710" font-size="18" fill="#5c6e77">Supplied rule templates and skills · Missing evidence can return the agent to sensing</text></g></svg>