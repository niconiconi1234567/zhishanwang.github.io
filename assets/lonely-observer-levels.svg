<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img"><title>An outsider learns from an unfamiliar multi-agent system</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#307f81"/></marker></defs><rect width="1200" height="620" rx="18" fill="#f8fafb"/><text x="48" y="48" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#307f81" font-weight="700">THE LONELY OBSERVER · THREE RESEARCH LEVELS</text><text x="48" y="94" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#203b51" font-weight="400">An outsider learns from an unfamiliar multi-agent system</text><line x1="48" y1="119" x2="1152" y2="119" stroke="#b9cbd2"/><rect x="50" y="180" width="330" height="265" rx="16" fill="white" stroke="#b9cbd2"/><rect x="50" y="200" width="4" height="225" fill="#307f81"/><text x="72" y="218" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#307f81" font-weight="700">LEVEL 1</text><text x="72" y="250" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#203b51" font-weight="600">Control-relevant learning</text><text x="72" y="289" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">When do observed actions</text><text x="72" y="318" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">improve the observer’s</text><text x="72" y="347" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">own control task?</text><rect x="435" y="180" width="330" height="265" rx="16" fill="white" stroke="#b9cbd2"/><rect x="435" y="200" width="4" height="225" fill="#203b51"/><text x="457" y="218" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#203b51" font-weight="700">LEVEL 2</text><text x="457" y="250" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#203b51" font-weight="600">Hidden feedback</text><text x="457" y="289" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">Which mechanisms can be</text><text x="457" y="318" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">distinguished, with what</text><text x="457" y="347" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">sensing budget?</text><rect x="820" y="180" width="330" height="265" rx="16" fill="white" stroke="#b9cbd2"/><rect x="820" y="200" width="4" height="225" fill="#b87a36"/><text x="842" y="218" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#b87a36" font-weight="700">LEVEL 3</text><text x="842" y="250" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#203b51" font-weight="600">Strategic participation</text><text x="842" y="289" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">When is the learned model</text><text x="842" y="318" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">sufficient to enter,</text><text x="842" y="347" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">cooperate or probe?</text><path d="M380,310 L432,310" fill="none" stroke="#307f81" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M765,310 L817,310" fill="none" stroke="#307f81" stroke-width="2.2" marker-end="url(#arrow)"/><text x="50" y="503" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#307f81" font-weight="400">Additional information ≠ control benefit. Passive prediction ≠ intervention validity.</text><line x1="48" y1="551" x2="1152" y2="551" stroke="#b9cbd2"/><text x="48" y="588" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#617582" font-weight="400">A conceptual research roadmap; each level uses its own model and assumptions.</text></svg>