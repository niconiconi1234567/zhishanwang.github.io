<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img"><title>From a team strategy to executable vehicle behavior</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#307f81"/></marker></defs><rect width="1200" height="620" rx="18" fill="#f8fafb"/><text x="48" y="48" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#307f81" font-weight="700">AUTONOMOUS RACING · STRATEGY-TO-CONTROL INTERFACE</text><text x="48" y="94" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#203b51" font-weight="400">From a team strategy to executable vehicle behavior</text><line x1="48" y1="119" x2="1152" y2="119" stroke="#b9cbd2"/><rect x="50" y="180" width="330" height="250" rx="16" fill="white" stroke="#b9cbd2"/><rect x="50" y="200" width="4" height="210" fill="#307f81"/><text x="72" y="218" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#307f81" font-weight="700">INTENT</text><text x="72" y="250" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#203b51" font-weight="600">Team strategy</text><text x="72" y="289" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">Describe the tactical</text><text x="72" y="318" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">objective and the role of</text><text x="72" y="347" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">each vehicle.</text><rect x="435" y="180" width="330" height="250" rx="16" fill="white" stroke="#b9cbd2"/><rect x="435" y="200" width="4" height="210" fill="#203b51"/><text x="457" y="218" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#203b51" font-weight="700">INTERFACE</text><text x="457" y="250" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#203b51" font-weight="600">Local references</text><text x="457" y="289" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">Translate that objective</text><text x="457" y="318" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">into vehicle-level</text><text x="457" y="347" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">targets and constraints.</text><rect x="820" y="180" width="330" height="250" rx="16" fill="white" stroke="#b9cbd2"/><rect x="820" y="200" width="4" height="210" fill="#b87a36"/><text x="842" y="218" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#b87a36" font-weight="700">EXECUTION</text><text x="842" y="250" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#203b51" font-weight="600">Feedback control</text><text x="842" y="289" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">Track the targets and</text><text x="842" y="318" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">evaluate the resulting</text><text x="842" y="347" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">interaction in</text><text x="842" y="376" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#617582" font-weight="400">simulation.</text><path d="M380,300 L432,300" fill="none" stroke="#307f81" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M765,300 L817,300" fill="none" stroke="#307f81" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M985 438V493H215V438" fill="none" stroke="#307f81" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="48" y1="551" x2="1152" y2="551" stroke="#b9cbd2"/><text x="48" y="588" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#617582" font-weight="400">Conceptual pipeline · A controller must implement the intended strategy under constraints.</text></svg>